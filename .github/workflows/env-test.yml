name: env-test
on:
  workflow_dispatch:
  push:
    branches: ['**']   # keeps tag pushes from re-running the register job
    paths:
      - .github/workflows/env-test.yml
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo registered
  gated:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "gated job ran after approval"
