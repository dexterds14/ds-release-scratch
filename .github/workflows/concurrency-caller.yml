name: concurrency-caller
on:
  workflow_dispatch:
  push:
    branches: ['**']   # keeps tag pushes from re-running the register job
    paths:
      - .github/workflows/concurrency-caller.yml
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo registered
  first:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-sleep.yml
    with:
      label: first
  second:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-sleep.yml
    with:
      label: second
