name: scratch-bot

# SCRATCH HARNESS helper (dexterds14/ds-release-scratch): the "bot side" of a
# scenario, as github-actions[bot] with github.token (no ruleset bypass, and
# its pushes and PR events start no workflow). Dispatch on main:
#   gh workflow run scratch-bot.yml --ref main -f op=<op> [-f ...]
# ops:
#   commit-file  write content_b64 (base64) to path on branch, commit with
#                message as author "Name <email>" (default the release
#                bot identity merge-up.sh uses), push. A new branch starts at
#                from_ref (default: branch must exist).
#   close-pr     close PR pr as github-actions[bot], with body as comment
#                when given (a "Superseded by ..." body imitates supersession)
#   comment-pr   comment body on PR pr
#   approve-pr   approve PR pr (same as approve.yml)
#   kick-checks  approve the action_required pull_request runs of pr-checks on
#                PR pr's head (github.token PRs and pushes get them held)
#   reopen-pr    reopen PR pr
#   open-pr      open a PR as github-actions[bot]: head = branch, base = from_ref,
#                title = message, body = body

on:
  workflow_dispatch:
    inputs:
      op:
        type: choice
        options: [commit-file, close-pr, comment-pr, approve-pr, kick-checks, reopen-pr, open-pr]
        required: true
      pr:
        type: string
        default: ""
      branch:
        type: string
        default: ""
      from_ref:
        type: string
        default: ""
      path:
        type: string
        default: ""
      content_b64:
        type: string
        default: ""
      message:
        type: string
        default: "scratch-bot commit"
      author:
        description: "Name <email> for author and committer"
        type: string
        default: "ds-os-release-bot[bot] <346446406+ds-os-release-bot[bot]@users.noreply.github.com>"
      body:
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OP: ${{ inputs.op }}
      PR: ${{ inputs.pr }}
      BRANCH: ${{ inputs.branch }}
      FROM_REF: ${{ inputs.from_ref }}
      FILE_PATH: ${{ inputs.path }}
      CONTENT_B64: ${{ inputs.content_b64 }}
      MESSAGE: ${{ inputs.message }}
      AUTHOR: ${{ inputs.author }}
      BODY: ${{ inputs.body }}
    steps:
      - name: Run op
        run: |
          set -euo pipefail
          case "$OP" in
            commit-file)
              [ -n "$BRANCH" ] && [ -n "$FILE_PATH" ] || { echo "::error::branch and path are required"; exit 1; }
              git init -q w && cd w
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
              if git fetch -q origin "refs/heads/$BRANCH"; then
                git checkout -q -B work FETCH_HEAD
              else
                [ -n "$FROM_REF" ] || { echo "::error::$BRANCH does not exist and from_ref is empty"; exit 1; }
                git fetch -q origin "$FROM_REF"
                git checkout -q -B work FETCH_HEAD
              fi
              mkdir -p "$(dirname "$FILE_PATH")"
              printf '%s' "$CONTENT_B64" | base64 -d > "$FILE_PATH"
              git add -A -- "$FILE_PATH"
              AUTHOR_NAME="${AUTHOR% <*}"
              AUTHOR_EMAIL="${AUTHOR##*<}"; AUTHOR_EMAIL="${AUTHOR_EMAIL%>}"
              GIT_AUTHOR_NAME="$AUTHOR_NAME" GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL" \
              GIT_COMMITTER_NAME="$AUTHOR_NAME" GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL" \
                git commit -q -m "$MESSAGE"
              git push origin "HEAD:refs/heads/$BRANCH"
              echo "pushed $BRANCH at $(git rev-parse HEAD)"
              ;;
            close-pr)
              if [ -n "$BODY" ]; then gh pr close "$PR" -R "$REPO" --comment "$BODY"; else gh pr close "$PR" -R "$REPO"; fi ;;
            comment-pr)
              gh pr comment "$PR" -R "$REPO" --body "$BODY" ;;
            approve-pr)
              gh pr review "$PR" -R "$REPO" --approve --body "${BODY:-scratch approval (github-actions[bot])}" ;;
            reopen-pr)
              gh pr reopen "$PR" -R "$REPO" ;;
            open-pr)
              gh pr create -R "$REPO" --head "$BRANCH" --base "$FROM_REF" --title "$MESSAGE" --body "${BODY:-opened by scratch-bot (github-actions[bot])}" ;;
            kick-checks)
              oid=$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq .headRefOid)
              gh api "repos/$REPO/actions/runs?head_sha=$oid&event=pull_request" \
                --jq '.workflow_runs[] | select(.path == ".github/workflows/pr-checks.yml") | "\(.id) \(.status) \(.conclusion)"' > runs.txt
              cat runs.txt
              while read -r id st co; do
                [ "$co" = action_required ] || continue
                gh api -X POST "repos/$REPO/actions/runs/$id/approve" >/dev/null
                echo "approved pr-checks run $id for PR #$PR (${oid::7})"
              done < runs.txt ;;
            *) echo "::error::unknown op $OP"; exit 1 ;;
          esac
