name: token-push
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/token-push.yml
permissions:
  contents: write
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo registered
  push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit --allow-empty -m "empty commit pushed with GITHUB_TOKEN (check 2)"
          git push origin HEAD:pilot
          echo "pushed sha=$(git rev-parse HEAD)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
