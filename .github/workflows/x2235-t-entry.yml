name: x2235t entry
run-name: "x2235t entry ev=${{ github.event_name }} pr=${{ inputs.pr }} tag=${{ inputs.tag }} wr=${{ github.event.workflow_run.id }}"

# SCRATCH experiment x2235-t (thin review trigger). Prints what a default-branch
# workflow sees when started by a GITHUB_TOKEN dispatch or by workflow_run.

on:
  workflow_dispatch:
    inputs:
      pr:
        type: string
        required: false
        default: ""
      tag:
        description: "free label to tell runs apart"
        type: string
        required: false
        default: ""
  workflow_run:
    workflows: ["PR checks", "x2235t thin line", "x2235t thin noop"]
    types: [completed]

permissions: {}

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show context
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SWITCH_VISIBLE: ${{ vars.X2235T_SWITCH != '' }}
          SWITCH_VALUE: ${{ vars.X2235T_SWITCH }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_TAG: ${{ inputs.tag }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_STATUS: ${{ github.event.workflow_run.status }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_PATH: ${{ github.event.workflow_run.path }}
          WR_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WR_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          echo "event_name=${EVENT_NAME}"
          echo "actor=${ACTOR}"
          echo "triggering_actor=${TRIGGERING_ACTOR}"
          echo "ref=${REF}"
          echo "sha=${SHA}"
          echo "workflow_ref=${WORKFLOW_REF}"
          echo "switch_visible=${SWITCH_VISIBLE}"
          echo "switch_value=${SWITCH_VALUE}"
          echo "inputs.pr=${INPUT_PR}"
          echo "inputs.tag=${INPUT_TAG}"
          if [ "${EVENT_NAME}" = workflow_run ]; then
            echo "wr.id=${WR_ID}"
            echo "wr.name=${WR_NAME}"
            echo "wr.event=${WR_EVENT}"
            echo "wr.status=${WR_STATUS}"
            echo "wr.conclusion=${WR_CONCLUSION}"
            echo "wr.head_branch=${WR_HEAD_BRANCH}"
            echo "wr.head_sha=${WR_HEAD_SHA}"
            echo "wr.path=${WR_PATH}"
            echo "wr.actor=${WR_ACTOR}"
            echo "wr.triggering_actor=${WR_TRIGGERING_ACTOR}"
            echo "wr.head_repository=${WR_HEAD_REPO}"
            printf 'wr.pull_requests_count=%s\n' "$(jq 'length' <<<"${WR_PRS}")"
            printf 'wr.pull_requests=%s\n' "$(jq -c '[.[] | {number, head_ref: .head.ref, head_sha: .head.sha, base_ref: .base.ref}]' <<<"${WR_PRS}")"
          fi
