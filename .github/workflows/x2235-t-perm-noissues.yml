name: x2235t perm noissues
run-name: "x2235t perm noissues tag=${{ inputs.tag }}"

# SCRATCH experiment x2235-t: which REST reads a GITHUB_TOKEN with these permissions can make.

on:
  workflow_dispatch:
    inputs:
      pr:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      head_ref:
        type: string
        required: true
      tag:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -uo pipefail
          probe() {
            local label="$1" url="$2" code
            code="$(curl -sS -o body.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${REPO}/${url}")"
            printf 'PROBE %s | GET %s | http=%s | %s\n' "${label}" "${url}" "${code}" "$(jq -c 'if type=="array" then {array_len: length} elif has("message") then {message} elif has("total_count") then {total_count} elif has("permission") then {permission, role_name} else {keys: (keys|length)} end' body.json 2>/dev/null | head -c 300)"
          }
          probe reviews        "pulls/${PR}/reviews"
          probe issue          "issues/${PR}"
          probe issue_comments "issues/${PR}/comments"
          probe runs_by_sha    "actions/runs?head_sha=${HEAD_SHA}"
          probe activity       "activity?ref=refs/heads/${HEAD_REF}"
          probe collab_perm    "collaborators/dexterds14/permission"
          probe check_runs     "commits/${HEAD_SHA}/check-runs"
