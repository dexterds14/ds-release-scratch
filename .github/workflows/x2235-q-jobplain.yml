name: x2235-q-jobplain
run-name: "x2235-q ${{ inputs.label }}"
on:
  workflow_dispatch:
    inputs:
      group:
        description: concurrency group name
        required: true
        type: string
      label:
        description: unique label for this run
        required: true
        type: string
      hold:
        description: seconds to sleep
        required: false
        default: "5"
        type: string
permissions: {}
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ inputs.group }}
      cancel-in-progress: false
    steps:
      - name: hold
        env:
          LABEL: ${{ inputs.label }}
          HOLD: ${{ inputs.hold }}
        run: |
          echo "label=$LABEL"
          sleep "$HOLD"
          echo done
